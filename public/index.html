<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lumen</title>
  <meta name="theme-color" content="#050607">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lumen">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="description" content="Lumen: a student smart display. Your agenda, deadlines, exams and tasks on one quiet screen.">
  <link rel="preload" href="fonts/inter-tight-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // On a phone the pocket app (/taken) is the place to edit tasks; the full dashboard stays reachable with ?volledig=1.
    if (!/[?&](kiosk|volledig)\b/.test(location.search) && matchMedia("(max-width: 47.99em) and (pointer: coarse)").matches) location.replace("taken");
  </script>
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark"; } catch (e) {}</script>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- verlopen voor de weericoontjes (kleuren in app.css) -->
      <linearGradient id="wxg-sun" x1="0.2" y1="0.1" x2="0.8" y2="0.95"><stop class="wxg-sun-a" offset="0"/><stop class="wxg-sun-b" offset="1"/></linearGradient>
      <linearGradient id="wxg-moon" x1="0.1" y1="0" x2="0.9" y2="1"><stop class="wxg-moon-a" offset="0"/><stop class="wxg-moon-b" offset="1"/></linearGradient>
      <linearGradient id="wxg-cloud" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="25"><stop class="wxg-cloud-a" offset="0"/><stop class="wxg-cloud-b" offset="1"/></linearGradient>
      <linearGradient id="wxg-cloud-dark" gradientUnits="userSpaceOnUse" x1="0" y1="9" x2="0" y2="25"><stop class="wxg-dark-a" offset="0"/><stop class="wxg-dark-b" offset="1"/></linearGradient>
    </defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11 12 3.8l8.5 7.2"/><path d="M5.5 9.6V19a1.5 1.5 0 0 0 1.5 1.5h10a1.5 1.5 0 0 0 1.5-1.5V9.6"/><path d="M9.8 20.5v-5.3a1 1 0 0 1 1-1h2.4a1 1 0 0 1 1 1v5.3"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 17.2h.01M12 17.2h.01"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="m3.5 6.3 1.7 1.7 3-3.2M3.5 12.3l1.7 1.7 3-3.2M3.5 18.3l1.7 1.7 3-3.2M11.5 6.5h9M11.5 12.5h9M11.5 18.5h9"/></symbol>
    <symbol id="i-school" viewBox="0 0 24 24"><path d="M2.5 9.5 12 5l9.5 4.5L12 14z"/><path d="M6.5 11.6v4.2c0 1.4 2.5 2.7 5.5 2.7s5.5-1.3 5.5-2.7v-4.2"/><path d="M21.5 9.5v5.5"/></symbol>
    <symbol id="i-pot" viewBox="0 0 24 24"><path d="M4.5 10.5h15v5.5a4 4 0 0 1-4 4h-7a4 4 0 0 1-4-4z"/><path d="M2 12h2.5M19.5 12H22M6.5 7.5h11M12 5.5v2"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
    <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.5M12 16.2v.01"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3.5c3.5 4.2 6 7.6 6 10.6a6 6 0 0 1-12 0c0-3 2.5-6.4 6-10.6z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
    <symbol id="i-sunset" viewBox="0 0 24 24"><path d="M3 17.5h18M6.5 21h11M7.5 17.5a4.5 4.5 0 0 1 9 0M12 3.5v5M9.5 6.5 12 9l2.5-2.5M4.5 12.5l1.4 1M19.5 12.5l-1.4 1"/></symbol>
    <symbol id="i-sunrise" viewBox="0 0 24 24"><path d="M3 17.5h18M6.5 21h11M7.5 17.5a4.5 4.5 0 0 1 9 0M12 9V4M9.5 6.5 12 4l2.5 2.5M4.5 12.5l1.4 1M19.5 12.5l-1.4 1"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s6.5-5.6 6.5-11a6.5 6.5 0 0 0-13 0c0 5.4 6.5 11 6.5 11z"/><circle cx="12" cy="10" r="2.3"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5.5M6 11.5l6-6 6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 5.5H9l-6 6.5 6 6.5h11zM12 9.5l5 5M17 9.5l-5 5"/></symbol>
    <symbol id="i-shift" viewBox="0 0 24 24"><path d="M12 4 4 12.5h4.5V20h7v-7.5H20z"/></symbol>
    <symbol id="i-hourglass" viewBox="0 0 24 24"><path d="M6.5 3.5h11M6.5 20.5h11M7.8 3.5c0 4.6 4.2 5.3 4.2 8.5s-4.2 3.9-4.2 8.5M16.2 3.5c0 4.6-4.2 5.3-4.2 8.5s4.2 3.9 4.2 8.5"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 21c-3.6 0-6-2.5-6-5.8 0-3.6 2.6-5.4 3.6-8.7 2.4 1.5 3.4 3.4 3.4 5.4.9-.7 1.5-1.9 1.6-3.1 2.1 1.6 3.4 3.8 3.4 6.4 0 3.3-2.4 5.8-6 5.8z"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M11 3.5 12.9 9l5.6 2-5.6 2-1.9 5.5L9.1 13l-5.6-2 5.6-2z"/><path d="M18.5 15.5v4.5M16.25 17.75h4.5"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.4-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.6-7.5 10-7.5 10z"/></symbol>
    <symbol id="i-cloudsun" viewBox="0 0 24 24"><path d="M8.5 4.5V3M3.8 6.3l-1-1M3 11H1.5M13.2 6.3l1-1"/><path d="M5.2 13.2A4 4 0 1 1 12.4 9"/><path d="M8 20.5h9.5a4 4 0 0 0 .4-8 5.2 5.2 0 0 0-10 1.6A3.2 3.2 0 0 0 8 20.5z"/></symbol>
    <symbol id="i-wind" viewBox="0 0 24 24"><path d="M3 9h11a3 3 0 1 0-3-3M3 13h16a3 3 0 1 1-3 3M3 17h7"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></symbol>
    <symbol id="i-air" viewBox="0 0 24 24"><path d="M3 8.5c2-1.6 4-1.6 6 0s4 1.6 6 0 4-1.6 6 0M3 13c2-1.6 4-1.6 6 0s4 1.6 6 0 4-1.6 6 0M3 17.5c2-1.6 4-1.6 6 0s4 1.6 6 0 4-1.6 6 0"/></symbol>
    <symbol id="i-umbrella" viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5h-17A8.5 8.5 0 0 1 12 3.5zM12 12v6.5a2 2 0 0 0 4 0M12 2v1.5"/></symbol>
    <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8"/><path d="m9.5 21 2.2-6.5L14 17v4M8 12.5l2.5-4.5h3l2 3.5 2.5 1M11.7 14.5 13.2 8"/></symbol>
  </svg>

  <div class="shell">
    <nav class="rail" aria-label="Weergaven">
      <span class="rail__mark" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12.5" class="mark-ring"/><path d="M16 3.5a12.5 12.5 0 0 1 12.5 12.5" class="mark-arc"/><circle cx="16" cy="16" r="2.6" class="mark-dot"/></svg></span>
      <a class="rail__btn" href="#/" data-view="overzicht" data-hue="rose" aria-label="Overzicht" title="Overzicht"><svg class="i" aria-hidden="true"><use href="#i-home"/></svg><span>Overzicht</span></a>
      <a class="rail__btn" href="#/agenda" data-view="agenda" data-hue="apricot" aria-label="Agenda" title="Agenda"><svg class="i" aria-hidden="true"><use href="#i-calendar"/></svg><span>Agenda</span></a>
      <a class="rail__btn" href="#/taken" data-view="taken" data-hue="honey" aria-label="Taken" title="Taken"><svg class="i" aria-hidden="true"><use href="#i-list"/></svg><span>Taken</span></a>
      <a class="rail__btn" href="#/school" data-view="school" data-hue="sky" aria-label="School" title="School"><svg class="i" aria-hidden="true"><use href="#i-school"/></svg><span>School</span></a>
      <a class="rail__btn" href="#/recept" data-view="recept" data-hue="lilac" aria-label="Recept" title="Recept"><svg class="i" aria-hidden="true"><use href="#i-pot"/></svg><span>Recept</span></a>
      <div class="rail__sys" id="sys" aria-label="Systeem"></div>
    </nav>

    <main id="main">
      <!-- Overzicht -->
      <div class="view ov overview" data-view="overzicht">
        <div class="clock">
          <div class="clock__main">
            <p class="clock__greet" id="clock-greet" data-hue="rose"></p>
            <div class="clock__row"><time class="clock__time" id="clock-time">--:--</time><span class="clock__sec" id="clock-sec"></span></div>
            <div class="clock__date"><span id="clock-date"></span><i class="spectrum" aria-hidden="true"></i></div>
          </div>
          <div class="clock__wx" id="ov-now"></div>
        </div>
        <a class="card" id="ov-weather" href="#/weer" aria-label="Weer: tik voor de verwachting"><div class="skel"><span></span><span></span></div></a>
        <section class="card" id="ov-agenda" aria-label="Agenda"><div class="skel"><span></span><span></span><span></span><span></span></div></section>
        <section class="card" id="ov-todos" aria-label="Taken"><div class="skel"><span></span><span></span><span></span></div></section>
        <a class="card ov-school" id="ov-school" href="#/school?toon=deadlines" aria-label="Deadlines en examens"></a>
      </div>

      <!-- Agenda -->
      <div class="view page" data-view="agenda" hidden>
        <header class="page-head"><h1 data-hue="apricot"><span class="page-ic"><svg class="i" aria-hidden="true"><use href="#i-calendar"/></svg></span>Agenda</h1><div class="agenda-controls" id="agenda-controls"></div><span class="page-head__meta" id="agenda-note"></span><span class="page-clock"></span></header>
        <div class="page__body agenda-body" id="agenda-body"></div>
      </div>

      <!-- Taken -->
      <div class="view page" data-view="taken" hidden>
        <header class="page-head"><h1 data-hue="honey"><span class="page-ic"><svg class="i" aria-hidden="true"><use href="#i-list"/></svg></span>Taken</h1><span class="page-head__meta" id="board-meta"></span><span class="page-clock"></span></header>
        <form class="composer" id="composer" data-form="quick" autocomplete="off"></form>
        <div class="page__body board" id="board"></div>
      </div>

      <!-- School -->
      <div class="view page" data-view="school" hidden>
        <header class="page-head"><h1 data-hue="sky"><span class="page-ic"><svg class="i" aria-hidden="true"><use href="#i-school"/></svg></span>School</h1><div class="agenda-controls" id="school-controls"></div><span class="page-head__meta" id="school-meta"></span><span class="page-clock"></span></header>
        <div class="page__body school">
          <div class="stack">
            <section class="card sch-hero" id="school-due" aria-label="Volgende deadline"></section>
            <section class="card sch-hero" id="school-les" aria-label="Volgende les"></section>
            <section class="card sch-courses" id="school-courses" aria-label="Vakken"></section>
          </div>
          <section class="card" id="school-list" aria-label="Planning"></section>
        </div>
      </div>

      <!-- Recept -->
      <div class="view page" data-view="recept" hidden>
        <header class="page-head"><h1 data-hue="lilac"><span class="page-ic"><svg class="i" aria-hidden="true"><use href="#i-pot"/></svg></span>Recept</h1><div class="rc-timers" id="rc-timers" aria-live="polite"></div><div class="page-head__actions" id="recept-controls"></div><span class="page-clock"></span></header>
        <div class="page__body recept" id="recept">
          <section class="card rc-side" id="rc-side" aria-label="Ingrediënten"></section>
          <section class="card rc-main" id="rc-main" aria-label="Bereiding"></section>
        </div>
      </div>

      <!-- Weer (geen knop in de zijbalk: je opent het via het weer op het overzicht) -->
      <div class="view page" data-view="weer" hidden>
        <header class="page-head"><h1 data-hue="sky"><span class="page-ic"><svg class="i" aria-hidden="true"><use href="#i-cloudsun"/></svg></span>Weer</h1><span class="page-head__meta" id="wx-meta"></span><span class="page-clock"></span></header>
        <div class="page__body wx" id="wx">
          <section class="card wx-hero" id="wx-hero" aria-label="Het weer nu"></section>
          <section class="card wx-rain" id="wx-rain" aria-label="Regen in de komende twee uur"></section>
          <div class="wx-tiles" id="wx-tiles"></div>
          <section class="card wx-hours" id="wx-hours" aria-label="Per uur"></section>
          <section class="card wx-week" id="wx-week" aria-label="Komende dagen"></section>
        </div>
      </div>

    </main>
  </div>

  <div class="mo" id="morning" hidden role="dialog" aria-label="Ochtendoverzicht"></div>

  <div class="night" id="night" hidden>
    <div class="night__moon" id="night-moon" aria-hidden="true"></div>
    <div class="night__time" id="night-time"></div>
    <div class="night__date" id="night-date"></div>
    <div class="night__next" id="night-next"></div>
    <div class="night__hint">Tik om het display te wekken</div>
  </div>

  <div class="tsheet" id="tsheet" hidden></div>
  <div class="alarm" id="alarm" hidden role="alert"></div>
  <div id="toast-slot" role="status" aria-live="polite"></div>
  <div class="kb" id="kb" hidden aria-hidden="true"></div>

  <noscript><p style="padding:2rem">Lumen heeft JavaScript nodig om je agenda en taken op te halen.</p></noscript>
</body>
</html>
